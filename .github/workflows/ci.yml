name: ci

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version part to bump'
        type: choice
        required: false
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - skip

jobs:

  generate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      # Decide which part of the version to bump. A manual run uses the dispatch input; a push to
      # main takes it from the merged PR's labels, defaulting to patch when none is present.
      - name: Resolve version bump
        id: resolve_bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${DISPATCH_BUMP:-patch}"
            echo "Manual run: bumping '$bump'."
            echo "bump=$bump" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].number' 2>/dev/null || true)

          # A commit can belong to more than one PR; take the labels from all of them so a
          # deliberate bump label is never silently ignored.
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[].labels[].name' 2>/dev/null | { grep -E '^bump_(major|minor|patch)$' || true; } | sort -u)

          count=$(printf '%s' "$labels" | { grep -c . || true; })

          if [ "$count" -gt 1 ]; then
            echo "::error::Conflicting version bump labels on the pull request: $(echo "$labels" | paste -sd', ' -). Apply exactly one of bump_major, bump_minor or bump_patch."
            exit 1
          fi

          if [ "$count" -eq 1 ]; then
            bump="${labels#bump_}"
            echo "Pull request is labelled '$labels': bumping '$bump'."
          elif [ -z "$pulls" ]; then
            # No PR could be associated with this commit, so no label could have been read even if
            # one was applied. Distinguished from "found a PR with no label" because defaulting to
            # patch on an intended major is not recoverable once the tag is pushed.
            bump="patch"
            echo "::warning::No pull request is associated with ${GITHUB_SHA}, so no bump label could be read. Defaulting to '$bump'. If this was meant to be a minor or major release, delete the tag and re-run this workflow manually with the correct bump."
          else
            bump="patch"
            echo "No bump label on the pull request: defaulting to '$bump'."
          fi

          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: GitHub Tag Bump
        id: tag_bump
        if: steps.resolve_bump.outputs.bump != 'skip'
        uses: anothrNick/github-tag-action@1.73.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_VERSION: 1.0.0
          # Note: a #major / #minor / #patch / #none keyword in the commit message still takes
          # precedence over this, which is the action's own behaviour.
          DEFAULT_BUMP: ${{ steps.resolve_bump.outputs.bump }}

      # No new tag was cut, so the package version is the one already tagged. Republishing it is a
      # no-op on NuGet if it landed last time, and completes the release if it did not.
      - name: Reuse latest tag
        id: latest_tag
        if: steps.resolve_bump.outputs.bump == 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Read tags from the API rather than the working copy. The checkout is shallow, and tags
          # are not reliably present in it; the API is authoritative regardless of checkout depth.
          # Sorted here rather than trusting the API's order, and with -V so 1.0.10 beats 1.0.9.
          # tail rather than head: it consumes all input, so it cannot SIGPIPE sort under pipefail.
          tag=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' | sort -V | tail -n1)

          if [ -z "$tag" ]; then
            echo "::error::A 'skip' run reuses the latest tag, but no tags were returned for ${GITHUB_REPOSITORY}. Re-run with a patch, minor or major bump."
            exit 1
          fi

          echo "Reusing existing tag '$tag' without bumping."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          BUMP: ${{ steps.resolve_bump.outputs.bump }}
          VERSION: ${{ steps.tag_bump.outputs.new_tag || steps.latest_tag.outputs.tag }}
        run: |
          if [ "$BUMP" = "skip" ]; then
            echo "Version bump **skipped**; republishing \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bumped **$BUMP** to \`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
          fi

    outputs:
      new_version: ${{ steps.tag_bump.outputs.new_tag || steps.latest_tag.outputs.tag }}

  build:
    needs: generate-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet build src/Cabinet.csproj --configuration Release

      - name: Pack
        run: |
          dotnet pack src/Cabinet.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ needs.generate-version.outputs.new_version }} \
            -o packages

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: matt-goldman

      - name: Push to NuGet
        run: |
          dotnet nuget push packages/*.nupkg \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
